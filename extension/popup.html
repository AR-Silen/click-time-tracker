<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { width: 300px; padding: 14px; }
    .big { text-align: center; padding: 14px 0; }
    .big .project { font-weight: 600; margin-bottom: 8px; }
    .stats { display: flex; justify-content: space-around; }
    .stat b { display: block; font-size: 28px; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 12px; color: var(--muted); }
    .actions { display: flex; gap: 6px; margin-top: 12px; }
    .actions button { flex: 1; }
    footer { margin-top: 12px; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <h1>Click &amp; Time Tracker</h1>

  <!-- Idle: pick project and start -->
  <section id="idle">
    <label for="user">Your name</label>
    <input id="user" placeholder="e.g. Karl" />

    <label for="project">Project</label>
    <select id="project"></select>

    <div class="row" style="margin-top:6px">
      <input id="newProject" placeholder="Add new project…" />
      <button id="addProject" style="flex:0">Add</button>
    </div>

    <div class="actions">
      <button id="start" class="primary">Start</button>
    </div>
  </section>

  <!-- Running: live counter -->
  <section id="running" class="hidden">
    <div class="big">
      <div class="project" id="runProject"></div>
      <div class="stats">
        <div class="stat"><b id="clicks">0</b><span>clicks</span></div>
        <div class="stat"><b id="time">0:00</b><span>time</span></div>
      </div>
    </div>
    <label for="note">Note (optional)</label>
    <textarea id="note" rows="2" placeholder="What did you work on?"></textarea>
    <div class="actions">
      <button id="end" class="stop">End</button>
    </div>
    <p class="muted">Clicks in every browser tab are counted while running.
      <button id="discard" class="link">Discard session</button></p>
  </section>

  <p id="lastResult" class="muted"></p>

  <footer>
    <button id="openLog" class="link">Session log &amp; export →</button>
  </footer>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
